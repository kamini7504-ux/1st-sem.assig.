<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Page</title>
</head>
<body>

    <!-- Skip Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <nav aria-label="Main Navigation">
            <a href="#home">Home</a>
            <a href="#help">Help</a>
        </nav>
    </header>

    <main id="main-content">
        <h1>Accessible Page</h1>

        <!-- Form with ARIA labels and alt text/icons -->
        <form role="search" aria-label="Search form">
            <div>
                <!-- Input with descriptive ARIA label or label element -->
                <label for="search-input">Search:</label>
                <input type="text" id="search-input" name="search" aria-label="Search input">
                
                <!-- Icon/button with alt text or aria-label -->
                <button type="button" aria-label="Help">
                    <img src="question-icon.png" alt="Help icon">
                </button>
                <button type="button" aria-label="Clear">
                    <img src="close-icon.png" alt="Clear icon">
                </button>
            </div>
        </form>
    </main>

</body>
</html>
