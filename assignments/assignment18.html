<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <h1>ABC College Admission 2026</h1>
  </header>

  <main class="container">
    <section class="courses-section">
      <h2>Courses and Fees</h2>
      <table class="courses-table">
        <caption>Available Courses</caption>
        <thead>
          <tr>
            <th scope="col">Course</th>
            <th scope="col">Seats</th>
            <th scope="col">Fees</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
          </tr>
          <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="form-section">
      <fieldset>
        <legend>Application Form</legend>
        <form action="#" method="POST">
          
          <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
          </div><br>

          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div><br>

          <div class="form-group">
            <label for="course">Course:</label>
            <select id="course" name="course">
              <option value="B.Tech CSE">B.Tech CSE</option>
              <option value="BCA">BCA</option>
            </select>
          </div><br>

          <div class="form-group">
            <label for="statement">Statement:</label>
            <textarea id="statement" name="statement" rows="4"></textarea>
          </div><br>

          <button type="submit" class="apply-btn">Apply</button>
        </form>
      </fieldset>
    </section>
  </main>

  <footer class="main-footer">
    <p>&copy; 2026 ABC College</p>
  </footer>

</body>
</html>
