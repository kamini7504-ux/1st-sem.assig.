<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and Inline Elements</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 40px;
        }

        /* Styling for Block Elements */
        .block-item {
            background-color: #bfe0f5; /* Light blue background */
            margin-bottom: 5px;
        }

        /* Styling for Inline Elements */
        .inline-item {
            background-color: #a8f0a5; /* Light green background */
        }
    </style>
</head>
<body>

    <!-- Block Elements: Take up the full width available and start on a new line -->
    <div class="block-item">Block 1</div>
    <div class="block-item">Block 2</div>

    <!-- Inline Elements: Only take up as much width as necessary and sit side-by-side -->
    <span class="inline-item">Inline 1</span>
    <span class="inline-item">Inline 2</span>
    <span class="inline-item">Inline 3</span>

</body>
</html>
