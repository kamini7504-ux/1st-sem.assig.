<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Links demo</title>
</head>
<body id="top">

    <p>Links demo</p>

    <div>
        <a href="https://example.com" target="_blank">External link</a><br>
        <a href="#bottom">Jump to bottom</a><br>
        <a href="mailto:someone@example.com">Email us</a><br>
        <a href="https://example.com">
            <img src="logo.png" alt="Logo" width="150" height="80">
        </a>
    </div>

    <!-- Spacing to simulate scrolling down to the bottom -->
    <div style="margin-top: 500px;" id="bottom">
        Bottom. <a href="#top">Back to top</a>
    </div>

</body>
</html>
